name: Generar PDF del manual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/generar_pdf.py'
      - 'requirements.txt'
      - '.github/workflows/manual-pdf.yml'
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/generar_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: manual-instalacion-pdf
          path: dist/Manual_de_instalacion_Yooz2SageNG_v1.2.pdf
          if-no-files-found: error
